aid: hades
name: Hades
description: >-
  Hades Mining GmbH is a Munich-based deep-tech extraction company building
  technology-first methods for accessing critical minerals and geothermal
  energy from ultra-deep rock formations. Its flagship system, Cerberus, uses
  high-power continuous-wave fiber lasers delivered through proprietary fiber
  optics to fracture rock without mechanical bit wear, paired with in-situ
  recovery (ISR) fluid circulation to extract minerals without open-pit
  excavation. The company positions itself at the intersection of geology,
  engineering, and geopolitics under the tagline "Sovereignty begins
  subsurface," aiming to reduce Western dependence on imported critical
  minerals. Hades is backed by HV Capital and Headline via a EUR 15M seed
  round. As a physical deep-tech extraction company, Hades publishes no public
  developer API, SDK, or MCP surface at this time.
